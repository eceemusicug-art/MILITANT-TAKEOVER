    <linearGradient id="flTimb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996a1a"/>
      <stop offset="25%" stop-color="#d69b2d"/>
      <stop offset="52%" stop-color="#f0b643"/>
      <stop offset="80%" stop-color="#d4982a"/>
      <stop offset="100%" stop-color="#8a5c13"/>
