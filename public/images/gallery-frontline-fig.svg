<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" width="1500" height="620" fill="none">
  <defs>
    <radialGradient id="flAmbient" cx="60%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#141a10" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#070906" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030403" stop-opacity="0"/>
