      <stop offset="18%" stop-color="#3d1f11"/>
      <stop offset="42%" stop-color="#61331c"/>
      <stop offset="64%" stop-color="#804425"/>
      <stop offset="85%" stop-color="#4a2614"/>
      <stop offset="100%" stop-color="#1d0f07"/>
