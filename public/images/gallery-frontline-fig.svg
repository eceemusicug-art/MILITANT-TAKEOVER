    <linearGradient id="flSkinShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#995632" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#995632" stop-opacity="0"/>
