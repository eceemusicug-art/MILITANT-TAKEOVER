      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24130a"/>
      <stop offset="20%" stop-color="#442313"/>
      <stop offset="50%" stop-color="#69371e"/>
      <stop offset="78%" stop-color="#4d2917"/>
