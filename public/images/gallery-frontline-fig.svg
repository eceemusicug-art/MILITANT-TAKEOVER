      <stop offset="0%" stop-color="#f5c762"/>
      <stop offset="45%" stop-color="#dfa433"/>
      <stop offset="100%" stop-color="#a37018"/>
    </linearGradient>
    <linearGradient id="flSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d280c"/>
      <stop offset="50%" stop-color="#5a3d13"/>
      <stop offset="100%" stop-color="#281a08"/>
